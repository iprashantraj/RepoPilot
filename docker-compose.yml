services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: repopilot
      POSTGRES_PASSWORD: repopilot
      POSTGRES_DB: repopilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repopilot -d repopilot"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

# No Ollama service. v1 uses:
#   - Groq → Cerebras → Hugging Face Inference Providers for chat completion
#   - In-process fastembed (ONNX, HF weights) for embeddings
# See packages/core/src/repopilot_core/llm/provider.py for the wiring.

volumes:
  postgres_data:
  redis_data:
