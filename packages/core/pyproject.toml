[project]
name = "repopilot-core"
version = "0.0.1"
description = "Shared core: settings, logging, and the single LLMProvider all agents go through."
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "httpx>=0.27",
    "tenacity>=9.0",
    # Embeddings run in-process via fastembed (ONNX Runtime, HF model weights).
    # No Ollama, no daemon, no torch. sentence-transformers served the same
    # model but dragged torch in with it: ~2.5 GB of image and ~2 GB resident,
    # which no free host will run. First call downloads weights into the
    # fastembed cache. numpy is fastembed's own dep, named here because the
    # embedder normalises vectors with it.
    "fastembed>=0.4",
    "numpy>=1.26",
    "huggingface-hub>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repopilot_core"]
