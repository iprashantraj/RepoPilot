[project]
name = "repopilot"
version = "0.0.1"
description = "RepoPilot — purpose-driven, grounded codebase onboarding tours."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }

[tool.uv.workspace]
members = [
    "packages/core",
    "packages/ingestion",
    "packages/agents",
    "packages/evals",
    "apps/api",
]

[tool.uv.sources]
repopilot-core = { workspace = true }
repopilot-ingestion = { workspace = true }
repopilot-agents = { workspace = true }
repopilot-evals = { workspace = true }
repopilot-api = { workspace = true }

[dependency-groups]
dev = [
    # Pinned to a minor range, and kept in lockstep with the `ruff-pre-commit`
    # rev in .pre-commit-config.yaml. The formatter's output changes between
    # minor versions, so a floating range means pre-commit formats one way and
    # CI's `ruff format --check` rejects it. Bump both together or neither.
    "ruff>=0.15.17,<0.16",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.1",
    "pre-commit>=3.8.0",
    "types-networkx>=3.3,<4",
]

# ────────────────────────────────────────────────────────────────────────────
# ruff
# ────────────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/*/src", "apps/*/src", "apps/*"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # flake8-bugbear
    "SIM",           # flake8-simplify
    "ASYNC",         # async best-practices
    "RUF",           # ruff-specific
]
ignore = [
    "E501",          # line length — formatter handles it
    "B008",          # function call in argument default (FastAPI uses this)
    "RUF001",        # ambiguous unicode in strings — docs use en dashes intentionally
    "RUF002",        # ambiguous unicode in docstrings — same reason
    "RUF003",        # ambiguous unicode in comments — same reason
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B011", "SIM117"]

# ────────────────────────────────────────────────────────────────────────────
# mypy
# ────────────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_decorators = false   # FastAPI / pytest decorators
plugins = ["pydantic.mypy"]
mypy_path = [
    "packages/core/src",
    "packages/ingestion/src",
    "packages/agents/src",
    "packages/evals/src",
    "apps/api/src",
]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["tests.*", "*.tests.*"]
disallow_untyped_defs = false

# ────────────────────────────────────────────────────────────────────────────
# pytest
# ────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "packages/core/tests",
    "packages/ingestion/tests",
    "packages/agents/tests",
    "packages/evals/tests",
    "apps/api/tests",
]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=repopilot_core",
    "--cov=repopilot_ingestion",
    "--cov=repopilot_agents",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
asyncio_mode = "auto"
markers = [
    "slow: opt-in slow tests (e.g., full httpx index) — skipped by default in CI fast lane.",
    "integration: requires live services (Postgres, Ollama, Redis).",
    "eval_sampled: PR-time sampled eval — runs subset of datasets against one repo, ≤5 min budget. Skipped in fast lane; activated by `make test-eval-sampled` and the eval-pr workflow.",
    "eval_full: main-branch full matrix eval — runs all datasets against fastapi/httpx/flask, ≤30 min budget. Activated by `make test-eval-full` and the eval-main workflow.",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pydantic.*",
]

[tool.coverage.run]
branch = true
source = ["packages/core/src", "packages/ingestion/src", "packages/agents/src"]
# Skip live-service orchestration: exercised under `slow` / `integration`
# markers, not in the fast CI lane. Same for migration scripts.
omit = [
    "**/tests/**",
    "**/__init__.py",
    "**/migrations/**",
    "packages/ingestion/src/repopilot_ingestion/persist.py",
    "packages/ingestion/src/repopilot_ingestion/pipeline.py",
    "packages/ingestion/src/repopilot_ingestion/embed.py",
    "packages/ingestion/src/repopilot_ingestion/summary.py",
    "apps/api/src/repopilot_api/jobs/**",
    # Phase 2 tools that touch live Postgres/Ollama — exercised under
    # slow/integration, not the fast lane.
    "packages/agents/src/repopilot_agents/tools/vector_search.py",
    "packages/agents/src/repopilot_agents/tools/read_chunks.py",
    "packages/agents/src/repopilot_agents/tools/graph_traverse.py",
    "packages/agents/src/repopilot_agents/tools/graph_metrics.py",
    "packages/agents/src/repopilot_agents/tools/_adjacency.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
